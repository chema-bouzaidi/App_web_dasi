<!DOCTYPE html>
<html>
    <head>
        <title>Statistiques</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="./js/echarts_v6.0.0.min.js"></script>
        <style>
            body { font-family: sans-serif; padding: 20px; background: #f8f8f8; }
            h1 { margin-bottom: 24px; }
            h2 { margin-bottom: 10px; font-size: 0.75rem; text-transform: uppercase;
                 letter-spacing: 0.06em; color: #777; }
            .colonnes {
                display: flex; gap: 30px; flex-wrap: wrap;
                margin-top: 20px; align-items: flex-start; justify-content: center;
            }
            .top5-col { flex: 1; min-width: 180px; max-width: 230px; }
            .top5-row {
                display: flex; justify-content: space-between; align-items: center;
                padding: 8px 0;
            }
            .top5-row .nom { font-size: 14px; color: #222; }
            .nb {
                background: #6c63ff; color: #fff;
                border-radius: 12px; padding: 2px 10px;
                font-size: 12px; font-weight: 600;
                white-space: nowrap; margin-left: 10px;
            }
            .camembert-col {
                display: flex; flex-direction: column;
                align-items: center; min-width: 260px;
            }
            .titre-moy {
                display: flex; align-items: center; gap: 8px; margin-bottom: 16px;
            }
            .titre-moy .label {
                font-size: 0.75rem; font-weight: 500; text-transform: uppercase;
                letter-spacing: 0.06em; color: #777;
            }
            .cam-title {
                font-size: 0.75rem; font-weight: 500; text-transform: uppercase;
                letter-spacing: 0.06em; color: #777; margin: 0 0 6px; text-align: center;
            }
            #camembert { width: 260px; height: 260px; }
        </style>
    </head>
    <body>
        <a href="AccueilEmp.html">&larr; Retour</a>
        <h1>Statistiques</h1>

        <div class="colonnes">

            <div class="top5-col">
                <h2>Top 5 Médiums</h2>
                <div id="liste-mediums"></div>
            </div>

            <div class="camembert-col">
                <div class="titre-moy">
                    <span class="label">Nombre consultations / médium</span>
                    <span class="nb" id="moyenne-employes"></span>
                </div>
                <p class="cam-title">Répartition clients par employé</p>
                <div id="camembert"></div>
            </div>

            <div class="top5-col">
                <h2>Top 5 Pigeons Clients</h2>
                <div id="liste-clients"></div>
            </div>

        </div>

        <script>
            async function chargerStatistiques() {
                let json = await fetch('./ActionServlet?todo=statistiques')
                    .then(r => { if (!r.ok) throw r.status; return r.json(); })
                    .catch(e => { console.log(e); return null; });

                if (!json) {
                    document.body.innerHTML += '<p>Erreur lors du chargement des statistiques.</p>';
                    return;
                }

                let listeMediums = document.getElementById('liste-mediums');
                for (let m of json.top5Mediums) {
                    let div = document.createElement('div');
                    div.className = 'top5-row';
                    div.innerHTML = '<span class="nom">' + m.denomination + '</span>'
                                  + '<span class="nb">' + m.nbConsultations + '</span>';
                    listeMediums.appendChild(div);
                }

                let listeClients = document.getElementById('liste-clients');
                for (let c of json.top5Clients) {
                    let div = document.createElement('div');
                    div.className = 'top5-row';
                    div.innerHTML = '<span class="nom">' + c.prenom + ' ' + c.nom + '</span>'
                                  + '<span class="nb">' + c.nbConsultations + '</span>';
                    listeClients.appendChild(div);
                }

                document.getElementById('moyenne-employes').textContent =
                    json.moyenneConsultationsParEmploye;

                dessinerCamembert(json.topEmployes);
            }

            function dessinerCamembert(employes) {
                let data = employes.map(e => ({
                    name: e.prenom + ' ' + e.nom,
                    value: e.nbConsultations
                }));

                let chart = echarts.init(document.getElementById('camembert'));
                chart.setOption({
                    tooltip: { trigger: 'item' },
                    legend: { show: false },
                    series: [{
                        type: 'pie',
                        radius: ['40%', '70%'],
                        avoidLabelOverlap: false,
                        itemStyle: {
                            borderRadius: 6,
                            borderColor: '#f8f8f8',
                            borderWidth: 2
                        },
                        label: { show: false },
                        emphasis: {
                            label: { show: true, fontSize: 14, fontWeight: 'bold' }
                        },
                        labelLine: { show: false },
                        data: data
                    }]
                });
            }

            window.onload = chargerStatistiques;
        </script>
    </body>
</html>
