<!DOCTYPE html>
<html>
    <head>
        <title>Ma Consultation</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            #phase-consultation {
                display: flex;
                gap: 60px;
                margin-top: 20px;
            }
            .section-titre {
                font-weight: bold;
                margin-bottom: 8px;
            }
            .niveaux {
                display: flex;
                gap: 8px;
                margin-bottom: 10px;
                align-items: center;
            }
            .niveaux label {
                width: 60px;
            }
            .niveaux button {
                width: 35px;
            }
            .niveaux button.selectionne {
                background-color: #555;
                color: white;
            }
            #zone-prediction {
                margin-top: 15px;
                white-space: pre-line;
            }
            #zone-commentaire {
                margin-top: 20px;
            }
            #commentaire {
                display: block;
                width: 300px;
                height: 80px;
                margin-top: 6px;
            }
            #btn-terminer {
                margin-top: 15px;
                background-color: #c0392b;
                color: white;
                padding: 8px 16px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div id="entete"></div>
        <div id="phase-attente"></div>
        <div id="phase-consultation" style="display:none;"></div>

        <script>
            let niveaux = { amour: null, sante: null, travail: null };

            async function chargerMaConsultation() {
                let url = './ActionServlet?todo=ma-consultation';
                let json = await fetch(url)
                    .then(r => { if (!r.ok) throw r.status; return r.json(); })
                    .catch(e => { console.log(e); return null; });

                let entete = document.getElementById('entete');
                let attente = document.getElementById('phase-attente');

                if (!json || !json.succes) {
                    attente.innerHTML = '<p>Aucune consultation en cours.</p>';
                    return;
                }

                // Entête permanent
                entete.innerHTML = '<h1>Ma Consultation avec ' + json.prenomClient + ' ' + json.nomClient + '</h1>';

                // Phase attente
                let html = '<h2>Vous incarnez ' + json.denominationMedium + '</h2>';
                html += '<h2>Profil Astral de ' + json.prenomClient + ' ' + json.nomClient + '</h2>';
                html += '<div><label>Signe du zodiaque : </label><span>' + json.signeZodiaque + '</span></div>';
                html += '<div><label>Signe Chinois : </label><span>' + json.signeChinois + '</span></div>';
                html += '<div><label>Couleur : </label><span>' + json.couleur + '</span></div>';
                html += '<div><label>Animal Totem : </label><span>' + json.animalTotem + '</span></div>';
                html += '<h2>Historique des consultations</h2>';

                if (!json.historique || json.historique.length === 0) {
                    html += '<p>Aucune consultation passée.</p>';
                } else {
                    html += '<ul>';
                    for (let c of json.historique) {
                        let commentaire = c.commentaire ? ' — ' + c.commentaire : '';
                        html += '<li>Médium : ' + c.medium + ' | Date : ' + c.date + commentaire + '</li>';
                    }
                    html += '</ul>';
                }

                html += '<button onclick="demarrerConsultation()">Démarrer la Consultation</button>';
                attente.innerHTML = html;
            }

            async function demarrerConsultation() {
                let url = './ActionServlet?todo=se-mettre-pret';
                let json = await fetch(url)
                    .then(r => { if (!r.ok) throw r.status; return r.json(); })
                    .catch(e => { console.log(e); return null; });

                if (json && json.succes) {
                    alert('Vous recevrez vite un appel du client !');
                    document.getElementById('phase-attente').style.display = 'none';
                    afficherPhaseConsultation();
                } else {
                    alert('Échec du démarrage de la consultation.');
                }
            }

            function afficherPhaseConsultation() {
                let phase = document.getElementById('phase-consultation');
                phase.style.display = 'flex';

                // Colonne gauche : prédiction
                let colPred = document.createElement('div');
                colPred.innerHTML = `
                    <div class="section-titre">Faire une prédiction</div>
                    <div class="niveaux">
                        <label>Amour</label>
                        <button onclick="selectionner('amour',1,this)">1</button>
                        <button onclick="selectionner('amour',2,this)">2</button>
                        <button onclick="selectionner('amour',3,this)">3</button>
                        <button onclick="selectionner('amour',4,this)">4</button>
                    </div>
                    <div class="niveaux">
                        <label>Santé</label>
                        <button onclick="selectionner('sante',1,this)">1</button>
                        <button onclick="selectionner('sante',2,this)">2</button>
                        <button onclick="selectionner('sante',3,this)">3</button>
                        <button onclick="selectionner('sante',4,this)">4</button>
                    </div>
                    <div class="niveaux">
                        <label>Travail</label>
                        <button onclick="selectionner('travail',1,this)">1</button>
                        <button onclick="selectionner('travail',2,this)">2</button>
                        <button onclick="selectionner('travail',3,this)">3</button>
                        <button onclick="selectionner('travail',4,this)">4</button>
                    </div>
                    <button onclick="fairePrediction()">Faire la prédiction</button>
                    <div id="zone-prediction"></div>
                `;
                phase.appendChild(colPred);

                // Colonne droite : commentaire + terminer
                let colTerminer = document.createElement('div');
                colTerminer.innerHTML = `
                    <div id="zone-commentaire">
                        <div class="section-titre">Commentaire</div>
                        <textarea id="commentaire" placeholder="Laissez votre commentaire..."></textarea>
                    </div>
                    <button id="btn-terminer" onclick="terminerConsultation()">Terminer la Consultation</button>
                `;
                phase.appendChild(colTerminer);
            }

            function selectionner(domaine, valeur, btn) {
                niveaux[domaine] = valeur;
                let btns = btn.parentElement.querySelectorAll('button');
                btns.forEach(b => b.classList.remove('selectionne'));
                btn.classList.add('selectionne');
            }

            async function fairePrediction() {
                if (niveaux.amour === null || niveaux.sante === null || niveaux.travail === null) {
                    alert('Veuillez sélectionner un niveau pour Amour, Santé et Travail.');
                    return;
                }
                let url = `./ActionServlet?todo=obtenir-prediction&amour=${niveaux.amour}&sante=${niveaux.sante}&travail=${niveaux.travail}`;
                let json = await fetch(url)
                    .then(r => { if (!r.ok) throw r.status; return r.json(); })
                    .catch(e => { console.log(e); return null; });

                let zone = document.getElementById('zone-prediction');
                if (json && json.succes && json.prediction) {
                    zone.innerHTML = '<strong>Prédiction :</strong><br>' + json.prediction.join('<br>');
                } else {
                    zone.innerHTML = '<em>Impossible d\'obtenir une prédiction.</em>';
                }
            }

            async function terminerConsultation() {
                let commentaire = document.getElementById('commentaire').value;
                let url = './ActionServlet?todo=terminer-consultation';
                let options = { method: 'POST', body: new URLSearchParams({ commentaire: commentaire }) };
                let json = await fetch(url, options)
                    .then(r => { if (!r.ok) throw r.status; return r.json(); })
                    .catch(e => { console.log(e); return null; });

                if (json && json.succes) {
                    window.location.href = 'AccueilEmp.html';
                } else {
                    alert('Échec de la clôture de la consultation.');
                }
            }

            window.onload = chargerMaConsultation;
        </script>
    </body>
</html>
