<!DOCTYPE html>
<html>
    <head>
        <title>Statistiques</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body { font-family: sans-serif; padding: 20px; }
            .colonnes { display: flex; gap: 60px; flex-wrap: wrap; margin-top: 20px; }
            table { border-collapse: collapse; min-width: 250px; }
            th, td { border: 1px solid #ccc; padding: 8px 14px; text-align: left; }
            th { background-color: #f0f0f0; }
            h2 { margin-bottom: 8px; }
            #section-employes { margin-top: 30px; }
            canvas { margin-top: 10px; }
        </style>
    </head>
    <body>
        <a href="AccueilEmp.html">&larr; Retour</a>
        <h1>Statistiques</h1>

        <div class="colonnes">
            <div>
                <h2>Top 5 Médiums</h2>
                <table id="table-mediums">
                    <tr><th>Médium</th><th>Consultations</th></tr>
                </table>
            </div>
            <div>
                <h2>Top 5 Clients</h2>
                <table id="table-clients">
                    <tr><th>Client</th><th>Consultations</th></tr>
                </table>
            </div>
        </div>

        <div id="section-employes">
            <h2>Répartition des clients par employé</h2>
            <p id="moyenne-employes"></p>
            <canvas id="camembert" width="400" height="400"></canvas>
        </div>

        <script>
            async function chargerStatistiques() {
                let json = await fetch('./ActionServlet?todo=statistiques')
                    .then(r => { if (!r.ok) throw r.status; return r.json(); })
                    .catch(e => { console.log(e); return null; });

                if (!json) {
                    document.body.innerHTML += '<p>Erreur lors du chargement des statistiques.</p>';
                    return;
                }

                // Top 5 médiums
                let tableMediums = document.getElementById('table-mediums');
                for (let m of json.top5Mediums) {
                    let tr = document.createElement('tr');
                    tr.innerHTML = '<td>' + m.denomination + '</td><td>' + m.nbConsultations + '</td>';
                    tableMediums.appendChild(tr);
                }

                // Top 5 clients
                let tableClients = document.getElementById('table-clients');
                for (let c of json.top5Clients) {
                    let tr = document.createElement('tr');
                    tr.innerHTML = '<td>' + c.prenom + ' ' + c.nom + '</td><td>' + c.nbConsultations + '</td>';
                    tableClients.appendChild(tr);
                }

                // Moyenne
                document.getElementById('moyenne-employes').textContent =
                    'Nombre moyen de consultations par employé : ' + json.moyenneConsultationsParEmploye;

                // Camembert
                dessinerCamembert(json.topEmployes);
            }

            function dessinerCamembert(employes) {
                let canvas = document.getElementById('camembert');
                let ctx = canvas.getContext('2d');
                let total = employes.reduce((s, e) => s + e.nbConsultations, 0);
                if (total === 0) {
                    ctx.fillText('Aucune donnée', 180, 200);
                    return;
                }

                let couleurs = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6',
                                '#1abc9c','#e67e22','#34495e','#e91e63','#00bcd4'];
                let cx = 200, cy = 200, rayon = 160;
                let angleDepart = -Math.PI / 2;

                for (let i = 0; i < employes.length; i++) {
                    let e = employes[i];
                    let fraction = e.nbConsultations / total;
                    let angleFin = angleDepart + fraction * 2 * Math.PI;

                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.arc(cx, cy, rayon, angleDepart, angleFin);
                    ctx.closePath();
                    ctx.fillStyle = couleurs[i % couleurs.length];
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Label au milieu de la part
                    let angleMilieu = angleDepart + (fraction * Math.PI);
                    let labelX = cx + (rayon * 0.65) * Math.cos(angleMilieu);
                    let labelY = cy + (rayon * 0.65) * Math.sin(angleMilieu);
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(e.prenom + ' ' + e.nom, labelX, labelY);

                    angleDepart = angleFin;
                }
            }

            window.onload = chargerStatistiques;
        </script>
    </body>
</html>
